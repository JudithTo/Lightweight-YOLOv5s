# parameters
nc: 1  # number of classes
depth_multiple: 0.33 # model depth multiple
width_multiple: 0.50  # layer channel multiple


# anchors
anchors:
  - [10,13, 16,30, 33,23]  # P3/8
  - [30,61, 62,45, 59,119]  # P4/16
  - [116,90, 156,198, 373,326]  # P5/32

# YOLOv5 backbone
backbone:
  # [from, number, module, args]
  [[-1, 1, Focus, [64, 3]],  # 0-P1/2  320  3,80
   [-1, 1, Conv, [128, 3, 2]],  # 1-P2/4  160  80,160
   [-1, 3, C3, [128]],  # 160, 160
   [-1, 1, Conv, [256, 3, 2]],  # 3-P3/8  80  # 160, 320
   [-1, 9, C3, [256]],  # 320, 320
   [-1, 1, Conv, [512, 3, 2]],  # 5-P4/16  40  # 320, 640
   [-1, 9, C3, [512]],  # 640, 640
   [-1, 1, Conv, [1024, 3, 2]],  # 7-P5/32  20 # 640, 1280
   [-1, 1, SPP, [1024, [5, 9, 13]]],  # 1280, 1280
   [-1, 3, C3, [1024, False]],  # 9 1280, 1280
   #[-1, 1, CBAM,[1024]],
   [-1, 1, CoordAtt, [1024，32]], #注意力可换成CA
  ]

# YOLOv5 head
head:
  [[-1, 1, Conv, [512, 1, 1]],  # 11 1280, 640
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  # 12 40 上采样
   [[-1, 6], 1, Concat, [256, 256]],  # 13 cat backbone P4  # cat 40,40
   [-1, 3, C3, [512, False]],  # 14  # 640, 640

   [-1, 1, Conv, [256, 1, 1]], # 640, 320
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  # 80  640, 320 上采样
   [[-1, 4], 1, Concat, [128, 128]],  # cat backbone P3  # cat 80,80
   [-1, 4, C3, [256, False]],  # 18 (P3/8-small) # 320, 320

   [-1, 1, Conv, [512, 3, 2]],   # 320, 640 # 下 40
   [[-1, 6, 14], 1, Concat, [256, 256]],  # cat head P4  # cat 40,40
   [-1, 3, C3, [512, False]],  # 21 (P4/16-medium)  # 640, 640

   [-1, 1, Conv, [1024, 3, 2]], # 640, 1280 # 下 20  #22
   [[-1, 9], 1, Concat, [512, 512]],  # cat head P5  cat 20,20 #23
   [-1, 3, C3, [1024, False]],  # (P5/32-large) # 1280, 1280  #24

   [[18, 21, 24], 1, Detect, [nc, anchors]] # Detect(P3, P4, P5)
  ]


